<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ombreGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b9fb4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6fa7ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5db8a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with ombre gradient -->
  <circle cx="100" cy="100" r="100" fill="url(#ombreGradient)" />
  
  <!-- Inner circle with slight contrast -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  
  <!-- Initials "SJ" -->
  <text x="100" y="120" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="90" font-weight="700" text-anchor="middle" fill="white" opacity="0.95">
    SJ
  </text>
</svg>
