<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="800" fill="#1C1F26"/>
  <!-- prompt bubble -->
  <g transform="translate(90 90)">
    <rect width="560" height="96" rx="18" fill="#2D323C"/>
    <text x="28" y="42" font-size="22" fill="#C9CEDA">I make $4,200 a month, have $6,000 on a card</text>
    <text x="28" y="72" font-size="22" fill="#C9CEDA">and want to buy a home in five years.</text>
  </g>
  <g transform="translate(510 210)">
    <rect width="600" height="96" rx="18" fill="#2B3FD1"/>
    <text x="28" y="42" font-size="22" fill="#fff">Clear the card in 14 months, then move</text>
    <text x="28" y="72" font-size="22" fill="#fff">$900 a month into a high-yield account.</text>
  </g>
  <!-- chart -->
  <g transform="translate(90 360)">
    <g stroke="#3A404B" stroke-width="2">
      <path d="M0 0h1020M0 90h1020M0 180h1020M0 270h1020M0 360h1020"/>
    </g>
    <path d="M0 330 C200 320 340 260 500 200 S800 70 1020 20" fill="none" stroke="#9BA8F5" stroke-width="6"/>
    <path d="M0 40 C120 60 260 140 380 250 S560 350 1020 355" fill="none" stroke="#E2E5EC" stroke-width="6" stroke-dasharray="14 10"/>
    <circle cx="380" cy="250" r="10" fill="#E2E5EC"/>
    <text x="360" y="300" font-size="20" fill="#E2E5EC">Card paid off</text>
    <text x="1020" y="0" text-anchor="end" font-size="20" fill="#9BA8F5">Net worth</text>
    <g font-size="18" fill="#8A909C">
      <text x="0" y="400">Month 1</text><text x="500" y="400" text-anchor="middle">Month 30</text><text x="1020" y="400" text-anchor="end">Month 60</text>
    </g>
  </g>
</svg>
